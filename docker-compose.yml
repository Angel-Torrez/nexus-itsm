services:
  db:
    image: postgres:15-alpine
    container_name: nexus_postgres
    environment:
      POSTGRES_DB: nexus_itsm_db
      POSTGRES_USER: nexus_admin
      POSTGRES_PASSWORD: nexus_secret_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus_admin -d nexus_itsm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: nexus_django_app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - USE_POSTGRES=True
      - DB_NAME=nexus_itsm_db
      - DB_USER=nexus_admin
      - DB_PASSWORD=nexus_secret_pass
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: